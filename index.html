function attachAuthHandlers() {

  document.querySelectorAll('input[name="role"]').forEach(r => {
    r.addEventListener('change', (e) => { signupRole = e.target.value; renderAuthScreen(); });
  });
}

async function handleAuthSubmit(e) {
  e.preventDefault();
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const submitBtn = document.getElementById('auth-submit');
  const label = document.getElementById('auth-submit-label');

  submitBtn.disabled = true;
  const originalLabel = label.textContent;
  label.innerHTML = `<span class="spinner-light inline-block align-middle"></span>`;

  try {
    if (authMode === 'signup') {
      const phone = document.getElementById('auth-phone').value.trim();
      const role = document.querySelector('input[name="role"]:checked').value;
      const coachId = role === 'client' ? document.getElementById('auth-coach').value : '';
      const experience = role === 'client' ? document.getElementById('auth-experience').value : '';
      const goals = role === 'client' ? document.getElementById('auth-goals').value.trim() : '';
      const injuries = role === 'client' ? document.getElementById('auth-injuries').value.trim() : '';

      if (role === 'client' && !coachId) {
        toast('Please select your coach.', 'info');
        submitBtn.disabled = false;
        label.textContent = originalLabel;
        return;
      }

      const { data, error } = await sb.auth.signUp({
        email,
        password,
        options: { data: { role, phone, coach_id: coachId, experience_level: experience, goals, injuries } }
      });
      if (error) throw error;

      if (data.session) {
        toast('Account created. Welcome!', 'success');
        await render();
      } else {
        toast('Check your email to confirm your account.', 'info');
        authMode = 'login';
        renderAuthScreen();
      }
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
      toast('Welcome back.', 'success');
      await render();
    }
  } catch (err) {
    console.error(err);
    toast(err.message || 'Something went wrong.', 'error');
    submitBtn.disabled = false;
    label.textContent = originalLabel;
  }
}

function toDateStr(d) {
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function computeStreak(dateStrs, restDays = []) {
  const activeSet = new Set(dateStrs);
  const restSet = new Set(restDays);
  let streak = 0;
  const cursor = new Date();
  if (!activeSet.has(toDateStr(cursor)) && !restSet.has(cursor.getDay())) cursor.setDate(cursor.getDate() - 1);
  while (activeSet.has(toDateStr(cursor)) || restSet.has(cursor.getDay())) {
    streak++;
    cursor.setDate(cursor.getDate() - 1);
  }
  return streak;
}

function computeAdherence(dateStrs, restDays = [], windowDays = 7) {
  const activeSet = new Set(dateStrs);
  const restSet = new Set(restDays);
  let expected = 0, completed = 0;
  const cursor = new Date();
  for (let i = 0; i < windowDays; i++) {
    if (!restSet.has(cursor.getDay())) {
      expected++;
      if (activeSet.has(toDateStr(cursor))) completed++;
    }
    cursor.setDate(cursor.getDate() - 1);
  }
  return { completed, expected, pct: expected ? Math.round((completed / expected) * 100) : 100 };
}

// Weekly adherence % for each of the last N weeks, oldest first — for a trend chart.
function computeAdherenceTrend(dateStrs, restDays = [], numWeeks = 4) {
  const activeSet = new Set(dateStrs);
  const restSet = new Set(restDays);
  const weeks = [];
  for (let w = numWeeks - 1; w >= 0; w--) {
    let expected = 0, completed = 0;
    for (let d = 0; d < 7; d++) {
      const cursor = new Date();
      cursor.setDate(cursor.getDate() - (w * 7 + d));
      if (!restSet.has(cursor.getDay())) {
        expected++;
        if (activeSet.has(toDateStr(cursor))) completed++;
      }
    }
    weeks.push(expected ? Math.round((completed / expected) * 100) : 100);
  }
  return weeks;
}

// "Since you joined" deltas: weight change from first to latest log, and best-lift change per exercise.
function computeSinceJoined(logs, setLogs) {
  const weightLogs = logs.filter(l => l.weight !== null && l.weight !== undefined).slice().sort((a, b) => new Date(a.logged_at) - new Date(b.logged_at));
  const weightDelta = weightLogs.length >= 2 ? parseFloat((weightLogs[weightLogs.length - 1].weight - weightLogs[0].weight).toFixed(1)) : null;

  const liftDeltas = [];
  const exerciseNames = [...new Set(setLogs.filter(s => s.weight).map(s => s.exercise_name))];
  exerciseNames.forEach(name => {
    const points = progressionPoints(setLogs, name);
    if (points.length >= 2) {
      liftDeltas.push({ name, delta: parseFloat((points[points.length - 1].weight - points[0].weight).toFixed(1)) });
    }
  });
  liftDeltas.sort((a, b) => b.delta - a.delta);

  return { weightDelta, bestLiftGain: liftDeltas[0] || null };
}

}

const WEEKDAY_LABELS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const SET_TYPE_LABELS = { warmup: 'Warmup', normal: 'Normal', drop: 'Drop', failure: 'Failure' };

function epley1RM(weight, reps) {
  if (!weight || !reps) return null;
  return reps === 1 ? weight : weight * (1 + reps / 30);
}

// Best-effort max weight ever logged for an exercise, from a client's full set-log history.
function maxWeightForExercise(setLogs, exerciseName) {
  const relevant = setLogs.filter(s => s.exercise_name === exerciseName && s.weight);
  if (!relevant.length) return null;
  return Math.max(...relevant.map(s => parseFloat(s.weight)));
}

// One data point per day: the heaviest set logged that day for the given exercise.
function progressionPoints(setLogs, exerciseName) {
  const byDate = {};
  setLogs.filter(s => s.exercise_name === exerciseName && s.weight).forEach(s => {
    const w = parseFloat(s.weight);
    if (!byDate[s.logged_date] || w > byDate[s.logged_date]) byDate[s.logged_date] = w;
  });
  return Object.entries(byDate).sort((a, b) => a[0].localeCompare(b[0])).map(([date, weight]) => ({ date, weight }));
}

function renderWeightDashboardCard(weightPoints) {
  if (!weightPoints.length) {
    return `
      <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm text-center py-8">
        <p class="text-sm text-slate-500">No weight logged yet.</p>
        <p class="text-xs text-slate-400 mt-1">Log your weight below to start your trend.</p>
      </div>
    `;
  }
  const latest = parseFloat(weightPoints[weightPoints.length - 1].weight);
  const prev = weightPoints.length > 1 ? parseFloat(weightPoints[weightPoints.length - 2].weight) : null;
  const delta = prev !== null ? +(latest - prev).toFixed(1) : null;
  const deltaColor = delta === null ? 'text-slate-400' : delta < 0 ? 'text-emerald-600' : delta > 0 ? 'text-amber-600' : 'text-slate-400';
  const deltaText = delta === null ? '' : delta === 0 ? 'No change' : `${delta > 0 ? '+' : ''}${delta}kg since last log`;

  return `
    <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
      <div class="flex items-end justify-between mb-2">
        <div>
          <p class="text-xs text-slate-500">Current weight</p>
          <p class="text-2xl font-semibold text-slate-900">${latest}<span class="text-sm font-normal text-slate-400">kg</span></p>
        </div>
        ${deltaText ? `<p class="text-xs font-medium ${deltaColor}">${deltaText}</p>` : ''}
      </div>
      ${weightPoints.length >= 2 ? `
        <svg viewBox="0 0 320 90" class="w-full h-24" preserveAspectRatio="none">
          ${(() => {
            const weights = weightPoints.map(p => parseFloat(p.weight));
            const min = Math.min(...weights), max = Math.max(...weights), range = max - min || 1;
            const coords = weights.map((val, i) => {
              const x = 6 + (i / (weights.length - 1)) * (320 - 12);
              const y = 8 + (1 - (val - min) / range) * (90 - 16);
              return [x, y];
            });
            const line = coords.map(c => c.join(',')).join(' ');
            const area = `6,90 ${line} 314,90`;
            return `
              <polygon points="${area}" fill="#10b981" fill-opacity="0.08" />
              <polyline points="${line}" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />
            `;
          })()}
        </svg>
      ` : `<p class="text-xs text-slate-400 mt-3">Log weight a couple more times to see a trend.</p>`}
    </div>
  `;
}

async function handleProfileUpdate(e) {
  e.preventDefault();
  const submitBtn = document.getElementById('profile-submit');
  const label = document.getElementById('profile-submit-label');
  submitBtn.disabled = true;
  const originalLabel = label.textContent;
  label.innerHTML = `<span class="spinner-light inline-block align-middle"></span>`;
  try {
    const { error } = await sb.from('profiles').update({
      name: document.getElementById('profile-name').value.trim() || null,
      phone: document.getElementById('profile-phone').value.trim() || null
    }).eq('id', currentUser.id);
    if (error) throw error;
    currentProfile.name = document.getElementById('profile-name').value.trim() || null;
    currentProfile.phone = document.getElementById('profile-phone').value.trim() || null;
    toast('Saved.', 'success');
  } catch (err) {
    console.error(err);
    toast(err.message || 'Could not save.', 'error');
  } finally {
    submitBtn.disabled = false;
    label.textContent = originalLabel;
  }
}

function handleDownloadRecap() {
  const card = document.getElementById('weekly-recap-card');
  if (!card || typeof html2canvas === 'undefined') { toast('Could not generate image right now.', 'error'); return; }
  html2canvas(card, { backgroundColor: null, scale: 2 }).then(canvas => {
    const link = document.createElement('a');
    link.download = 'my-week.png';
    link.href = canvas.toDataURL('image/png');

function initPhotoCompareSlider(photos) {
  const viewport = document.getElementById('compare-viewport');
  const slider = document.getElementById('compare-slider');
  if (!viewport || !slider) return;
  const beforeImg = document.getElementById('compare-before-img');
  const afterImg = document.getElementById('compare-after-img');
  const afterWrap = document.getElementById('compare-after-wrap');
  const handle = document.getElementById('compare-handle');
  const beforeSelect = document.getElementById('compare-before-select');
  const afterSelect = document.getElementById('compare-after-select');

  const syncWidth = () => { afterImg.style.width = `${viewport.clientWidth}px`; };
  syncWidth();
  window.addEventListener('resize', syncWidth);

  slider.addEventListener('input', () => {
    afterWrap.style.width = `${slider.value}%`;
    handle.style.left = `${slider.value}%`;
  });

  beforeSelect.addEventListener('change', () => {
    const p = photos.find(ph => ph.id === beforeSelect.value);
    if (p) beforeImg.src = p.photo_url;
  });
  afterSelect.addEventListener('change', () => {
    const p = photos.find(ph => ph.id === afterSelect.value);
    if (p) { afterImg.src = p.photo_url; syncWidth(); }
  });
}

async function handlePhotoUpload(e) {
  e.preventDefault();
  const fileInput = document.getElementById('photo-file');
  const file = fileInput.files[0];
  if (!file) { toast('Choose a photo first.', 'info'); return; }

  const submitBtn = document.getElementById('photo-submit');
  const label = document.getElementById('photo-submit-label');
  submitBtn.disabled = true;
  const originalLabel = label.textContent;
  label.innerHTML = `<span class="spinner-light inline-block align-middle"></span>`;

  try {
    const safeName = file.name.replace(/[^a-zA-Z0-9.\-_]/g, '_');
    const path = `${currentUser.id}/${Date.now()}-${safeName}`;
    const { error: upErr } = await sb.storage.from('progress-photos').upload(path, file);
    if (upErr) throw upErr;

    const { data: urlData } = sb.storage.from('progress-photos').getPublicUrl(path);
    const { error: insErr } = await sb.from('progress_photos').insert({
      client_id: currentUser.id,
      photo_url: urlData.publicUrl,
      note: document.getElementById('photo-note').value.trim() || null
    });
    if (insErr) throw insErr;

    toast('Photo uploaded.', 'success');
    await renderClientDashboardStub();
  } catch (err) {
    console.error(err);
    toast(err.message || 'Could not upload photo.', 'error');
    submitBtn.disabled = false;
    label.textContent = originalLabel;
  }
}

async function handleToggleComplete(workoutId, checked) {
  try {
    if (checked) {
      const { error } = await sb.from('workout_completions').upsert(
        { workout_id: workoutId, client_id: currentUser.id, completed_date: toDateStr(new Date()) },
        { onConflict: 'workout_id,completed_date' }

    } else {
      const { error } = await sb.from('workout_completions').delete()
        .eq('workout_id', workoutId).eq('completed_date', toDateStr(new Date()));
      if (error) throw error;
    }
    await renderClientDashboardStub();
  } catch (err) {
    console.error(err);
    toast(err.message || 'Could not update.', 'error');
  }
}

function renderAdherenceTrendChart(dateStrs, restDays, numWeeks) {
  const outlet = document.getElementById('adherence-trend-outlet');
  if (!outlet) return;
  const weekly = computeAdherenceTrend(dateStrs, restDays, numWeeks);
  const w = 320, h = 70, barGap = 3;
  const barWidth = (w - barGap * (numWeeks - 1)) / numWeeks;
  const bars = weekly.map((pct, i) => {
    const barHeight = Math.max(2, (pct / 100) * (h - 4));
    const x = i * (barWidth + barGap);
    const y = h - barHeight;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barWidth.toFixed(1)}" height="${barHeight.toFixed(1)}" rx="2" fill="#10b981" />`;
  }).join('');
  outlet.innerHTML = `
    <svg viewBox="0 0 ${w} ${h}" class="w-full" style="height: 70px" preserveAspectRatio="none">${bars}</svg>
    <p class="text-xs text-slate-500 mt-2">Avg ${Math.round(weekly.reduce((a, b) => a + b, 0) / weekly.length)}% over ${numWeeks} weeks</p>
  `;
}

const restTimerState = {}; // workoutId -> { duration, intervalId }

function adjustRestDuration(workoutId, delta) {
  const state = restTimerState[workoutId] || (restTimerState[workoutId] = { duration: 90, intervalId: null });
  state.duration = Math.max(15, Math.min(300, state.duration + delta));
  const el = document.getElementById(`rest-duration-${workoutId}`);
  if (el) el.textContent = `${state.duration}s`;
}

function startRestTimer(workoutId) {
  const state = restTimerState[workoutId] || (restTimerState[workoutId] = { duration: 90, intervalId: null });
  if (state.intervalId) { clearInterval(state.intervalId); state.intervalId = null; }
  let remaining = state.duration;
  const btn = document.getElementById(`rest-btn-${workoutId}`);
  if (!btn) return;
  btn.textContent = `⏱ ${remaining}s`;
  state.intervalId = setInterval(() => {
    remaining--;
    if (remaining <= 0) {
      clearInterval(state.intervalId);
      state.intervalId = null;
      btn.textContent = '⏱ Start rest';
      toast('Rest over — next set! 💪', 'success');
      if (navigator.vibrate) navigator.vibrate(250);
    } else {
      btn.textContent = `⏱ ${remaining}s`;
    }
  }, 1000);
}

function renderLiftChart(exerciseName, setLogs) {
  const outlet = document.getElementById('lift-chart-outlet');
  if (!outlet) return;
  const points = progressionPoints(setLogs, exerciseName);
  if (points.length < 2) {
    const best = points[0];
    outlet.innerHTML = `<p class="text-sm text-slate-500 text-center py-4">Log this exercise a couple more times to see a trend${best ? ` — best so far: ${best.weight}kg` : ''}.</p>`;
    return;
  }
  const bestPoint = points.reduce((a, b) => (b.weight > a.weight ? b : a));
  const bestSet = setLogs.find(s => s.exercise_name === exerciseName && parseFloat(s.weight) === bestPoint.weight && s.reps);
  const oneRM = bestSet ? epley1RM(bestPoint.weight, bestSet.reps) : null;
  outlet.innerHTML = `
    <svg viewBox="0 0 320 80" class="w-full h-20" preserveAspectRatio="none">
      <polyline points="${(() => {
        const weights = points.map(p => p.weight);
        const min = Math.min(...weights), max = Math.max(...weights), range = max - min || 1;
        return weights.map((val, i) => {
          const x = 8 + (i / (weights.length - 1)) * (320 - 16);
          const y = 8 + (1 - (val - min) / range) * (80 - 16);
          return `${x.toFixed(1)},${y.toFixed(1)}`;
        }).join(' ');
      })()}" fill="none" stroke="#10b981" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
    </svg>
    <p class="text-xs text-slate-500 mt-2">Best lift: <span class="font-medium text-slate-700">${bestPoint.weight}kg</span>${oneRM ? ` · Est. 1RM: <span class="font-medium text-slate-700">${oneRM.toFixed(1)}kg</span>` : ''}</p>
  `;
}

async function handleSaveSets(workoutId) {
  const label = document.getElementById(`save-sets-label-${workoutId}`);
  const btn = document.querySelector(`[data-save-sets="${workoutId}"]`);
  const exerciseName = btn.dataset.exerciseName;
  const panel = document.getElementById(`sets-panel-${workoutId}`);
  const todayStr = toDateStr(new Date());

  const rows = [];
  panel.querySelectorAll('[data-set-weight]').forEach(input => {
    const setNum = parseInt(input.dataset.setWeight, 10);
    const weight = input.value ? parseFloat(input.value) : null;
    const repsInput = panel.querySelector(`[data-set-reps="${setNum}"]`);
    const typeInput = panel.querySelector(`[data-set-type="${setNum}"]`);
    const reps = repsInput.value ? parseInt(repsInput.value, 10) : null;
    if (weight !== null || reps !== null) {
      rows.push({ set_number: setNum, weight, reps, set_type: typeInput.value });
    }
  });

  if (!rows.length) {
    toast('Enter at least one set before saving.', 'info');
    return;
  }

  btn.disabled = true;
  const originalLabel = label.textContent;
  label.innerHTML = `<span class="spinner-light inline-block align-middle"></span>`;

  try {
    const priorMax = maxWeightForExercise(cachedSetLogs, exerciseName);

    await sb.from('workout_set_logs').delete().eq('workout_id', workoutId).eq('logged_date', todayStr);
    const { error } = await sb.from('workout_set_logs').insert(
      rows.map(r => ({
        workout_id: workoutId,
        client_id: currentUser.id,
        exercise_name: exerciseName,
        logged_date: todayStr,
        ...r
      }))
    );
    if (error) throw error;

    await sb.from('workout_completions').upsert(
      { workout_id: workoutId, client_id: currentUser.id, completed_date: todayStr },
      { onConflict: 'workout_id,completed_date' }
    );

    const newMax = Math.max(...rows.filter(r => r.weight).map(r => r.weight), 0);
    if (newMax > 0 && (priorMax === null || newMax > priorMax)) {
      toast(`🎉 New PR on ${exerciseName}: ${newMax}kg!`, 'success');
    } else {
      toast('Sets saved.', 'success');
    }

    await renderClientDashboardStub();
  } catch (err) {
    console.error(err);
    toast(err.message || 'Could not save sets.', 'error');
    btn.disabled = false;
    label.textContent = originalLabel;
  }
}

  document.querySelectorAll('[data-toggle-paid]').forEach(btn => {
    btn.addEventListener('click', () => handleTogglePaid(btn.dataset.togglePaid, btn.dataset.currentPaid === 'true'));
  });
  document.querySelectorAll('[data-manage-client]').forEach(btn => {
    btn.addEventListener('click', () => {
      selectedClientId = btn.dataset.manageClient;
      coachView = 'clientDetail';
      renderActiveCoachView();
    });
  });
}

async function handleBulkWhatsapp() {
  const pendingWithPhone = coachClients.filter(c => !c.fee_paid && c.phone);
  if (!pendingWithPhone.length) return;
  toast(`Opening WhatsApp for ${pendingWithPhone.length} client${pendingWithPhone.length === 1 ? '' : 's'}. Allow popups if prompted.`, 'info');
  pendingWithPhone.forEach((c, i) => {
    setTimeout(() => {
      const msg = encodeURIComponent(`Hi ${c.name || 'there'}, just checking in — your payment is still pending. Let me know if you have any questions!`);
      window.open(`https://wa.me/${c.phone.replace(/[^0-9]/g, '')}?text=${msg}`, '_blank');
    }, i * 400);
  });
}

function attachActiveCoachViewHandlers() {
  if (coachView === 'roster') {
    const refreshRosterList = () => { document.getElementById('roster-list-container').innerHTML = renderRosterList(); attachRosterCardHandlers(); };
    const searchInput = document.getElementById('roster-search');
    if (searchInput) searchInput.addEventListener('input', (e) => { rosterSearch = e.target.value; refreshRosterList(); });
    const statusFilter = document.getElementById('roster-status-filter');
    if (statusFilter) statusFilter.addEventListener('change', (e) => { rosterStatusFilter = e.target.value; refreshRosterList(); });
    const tagFilter = document.getElementById('roster-tag-filter');
    if (tagFilter) tagFilter.addEventListener('change', (e) => { rosterTagFilter = e.target.value; refreshRosterList(); });
    const bulkWaBtn = document.getElementById('bulk-whatsapp-btn');
    if (bulkWaBtn) bulkWaBtn.addEventListener('click', handleBulkWhatsapp);

    const builderForm = document.getElementById('builder-form');
    if (builderForm) builderForm.addEventListener('submit', handleAssignWorkout);
    const librarySelect = document.getElementById('builder-library-select');
    if (librarySelect) librarySelect.addEventListener('change', handleLibraryAutofill);
    const assignTemplateForm = document.getElementById('assign-template-form');
    if (assignTemplateForm) assignTemplateForm.addEventListener('submit', handleAssignTemplate);
    attachRosterCardHandlers();
  } else if (coachView === 'library') {
    const libForm = document.getElementById('library-form');
    if (libForm) libForm.addEventListener('submit', handleAddLibraryExercise);
    document.querySelectorAll('[data-delete-library]').forEach(btn => {
      btn.addEventListener('click', () => handleDeleteLibraryExercise(btn.dataset.deleteLibrary));
    });
  } else if (coachView === 'templates') {
    const addRowForm = document.getElementById('template-add-row-form');
    if (addRowForm) addRowForm.addEventListener('submit', handleAddDraftItem);
    const saveTemplateForm = document.getElementById('save-template-form');
    if (saveTemplateForm) saveTemplateForm.addEventListener('submit', handleSaveTemplate);
    document.querySelectorAll('[data-remove-draft-item]').forEach(btn => {
      btn.addEventListener('click', () => { templateDraftItems.splice(parseInt(btn.dataset.removeDraftItem, 10), 1); renderActiveCoachView(); });
    });
    document.querySelectorAll('[data-delete-template]').forEach(btn => {
      btn.addEventListener('click', () => handleDeleteTemplate(btn.dataset.deleteTemplate));
    });
  }
}

function handleLibraryAutofill(e) {
  const ex = exerciseLibrary.find(x => x.id === e.target.value);
  if (!ex) return;
  document.getElementById('builder-exercise').value = ex.name || '';
  if (ex.default_sets) document.getElementById('builder-sets').value = ex.default_sets;
  document.getElementById('builder-reps').value = ex.default_reps || '';
  document.getElementById('builder-weight').value = ex.default_weight || '';
  document.getElementById('builder-video').value = ex.video_url || '';
  document.getElementById('builder-instructions').value = ex.default_instructions || '';
}

async function handleAssignWorkout(e) {
  e.preventDefault();
  const clientId = document.getElementById('builder-client').value;
  const exerciseName = document.getElementById('builder-exercise').value.trim();
  const sets = document.getElementById('builder-sets').value;
  const reps = document.getElementById('builder-reps').value.trim();
  const weight = document.getElementById('builder-weight').value.trim();
  const videoUrl = document.getElementById('builder-video').value.trim();
  const dayLabel = document.getElementById('builder-day-label').value.trim();
  const instructions = document.getElementById('builder-instructions').value.trim();
  const daysOfWeek = [...document.querySelectorAll('[data-builder-day]:checked')].map(cb => parseInt(cb.dataset.builderDay, 10));

  const submitBtn = document.getElementById('builder-submit');
  const label = document.getElementById('builder-submit-label');
  submitBtn.disabled = true;
  const originalLabel = label.textContent;
  label.innerHTML = `<span class="spinner-light inline-block align-middle"></span>`;

  try {
    const { error } = await sb.from('workouts').insert({
      client_id: clientId,
      exercise_name: exerciseName,
      sets: parseInt(sets, 10),
      target_reps: reps,
      target_weight: weight || null,
      video_url: videoUrl || null,
      day_label: dayLabel || null,
      days_of_week: daysOfWeek,
      instructions: instructions || null
    });
    if (error) throw error;

    toast('Workout assigned.', 'success');
    document.getElementById('builder-form').reset();
    document.querySelectorAll('[data-builder-day]').forEach(cb => { cb.checked = false; });
  } catch (err) {
    console.error(err);
    toast(err.message || 'Could not assign workout.', 'error');
  } finally {
    submitBtn.disabled = false;
    label.textContent = originalLabel;
  }
}

async function handleAssignTemplate(e) {
  e.preventDefault();
  const clientIds = [...document.querySelectorAll('[data-assign-template-client]:checked')].map(cb => cb.dataset.assignTemplateClient);
  const templateId = document.getElementById('assign-template-template').value;
  const template = routineTemplates.find(t => t.id === templateId);
  if (!clientIds.length) { toast('Select at least one client.', 'info'); return; }
  if (!template || !template.items.length) { toast('That template has no exercises.', 'info'); return; }

  const submitBtn = document.getElementById('assign-template-submit');
  const label = document.getElementById('assign-template-submit-label');
  submitBtn.disabled = true;
  const originalLabel = label.textContent;
  label.innerHTML = `<span class="spinner-light inline-block align-middle"></span>`;

  try {
    const rows = clientIds.flatMap(clientId => template.items.map(item => ({
      client_id: clientId,
      exercise_name: item.exercise_name,
      sets: item.sets,
      target_reps: item.target_reps,
      target_weight: item.target_weight,
      video_url: item.video_url,
      day_label: item.day_label || null,
      days_of_week: item.days_of_week || [],
      instructions: item.instructions || null
    })));
    const { error } = await sb.from('workouts').insert(rows);
    if (error) throw error;
    toast(`"${template.name}" assigned to ${clientIds.length} client${clientIds.length === 1 ? '' : 's'}.`, 'success');
    document.querySelectorAll('[data-assign-template-client]').forEach(cb => { cb.checked = false; });
  } catch (err) {
    console.error(err);
    toast(err.message || 'Could not assign template.', 'error');
  } finally {
    submitBtn.disabled = false;
    label.textContent = originalLabel;
  }
}

async function handleTogglePaid(clientId, currentPaid) {
  try {
    const { error } = await sb.from('profiles').update({ fee_paid: !currentPaid }).eq('id', clientId);
    if (error) throw error;
    toast(!currentPaid ? 'Marked as paid.' : 'Marked as unpaid.', 'success');
    await renderCoachDashboardStub();
  } catch (err) {
    console.error(err);
    toast(err.message || 'Could not update payment status.', 'error');
  }
}

function renderTemplateCard(t) {

        <h3 class="font-medium text-slate-900 text-sm truncate">${escapeHtml(t.name)}</h3>

function handleAddDraftItem(e) {
  e.preventDefault();
  templateDraftItems.push({
    exercise_name: document.getElementById('draft-exercise').value.trim(),
    sets: parseInt(document.getElementById('draft-sets').value, 10),
    target_reps: document.getElementById('draft-reps').value.trim(),
    target_weight: document.getElementById('draft-weight').value.trim() || null,
    video_url: document.getElementById('draft-video').value.trim() || null,
    day_label: document.getElementById('draft-day-label').value.trim() || null,
    days_of_week: [...document.querySelectorAll('[data-draft-day]:checked')].map(cb => parseInt(cb.dataset.draftDay, 10)),
    instructions: document.getElementById('draft-instructions').value.trim() || null
  });
  renderActiveCoachView();
}

async function handleSaveTemplate(e) {
  e.preventDefault();
  const name = document.getElementById('template-name').value.trim();
  if (!templateDraftItems.length) { toast('Add at least one exercise first.', 'info'); return; }

  const submitBtn = document.getElementById('save-template-submit');
  const label = document.getElementById('save-template-submit-label');
  submitBtn.disabled = true;
  const originalLabel = label.textContent;
  label.innerHTML = `<span class="spinner-light inline-block align-middle"></span>`;

  try {
    const { data: template, error } = await sb.from('routine_templates').insert({ coach_id: currentUser.id, name }).select().single();
    if (error) throw error;

    const itemRows = templateDraftItems.map((item, i) => ({ ...item, template_id: template.id, sort_order: i }));
    const { error: itemsError } = await sb.from('routine_template_items').insert(itemRows);
    if (itemsError) throw itemsError;

    toast('Template saved.', 'success');
    templateDraftItems = [];
    await renderCoachDashboardStub();
    coachView = 'templates';
    renderActiveCoachView();
  } catch (err) {
    console.error(err);
    toast(err.message || 'Could not save template.', 'error');
    submitBtn.disabled = false;
    label.textContent = originalLabel;
  }
}

async function handleDeleteTemplate(id) {
  try {
    const { error } = await sb.from('routine_templates').delete().eq('id', id);
    if (error) throw error;
    toast('Template deleted.', 'success');
    routineTemplates = routineTemplates.filter(t => t.id !== id);
    renderActiveCoachView();
  } catch (err) {
    console.error(err);
    toast(err.message || 'Could not delete template.', 'error');
  }
}

function renderCoachLogRow(log) {
  const date = new Date(log.logged_at).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  const metrics = [log.weight ? `${log.weight}kg` : null, log.water_liters ? `${log.water_liters}L water` : null].filter(Boolean).join(' · ');
  const measurements = [
    log.waist_cm ? `Waist ${log.waist_cm}cm` : null,
    log.chest_cm ? `Chest ${log.chest_cm}cm` : null,
    log.hips_cm ? `Hips ${log.hips_cm}cm` : null,

  return `

        <label class="text-xs text-slate-500 mb-1 block">Your feedback</label>
        <textarea id="feedback-${log.id}" rows="2" placeholder="Nice work — try adding 2.5kg next time..."
          class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500/60 resize-none">${escapeHtml(log.coach_feedback || '')}</textarea>
        <button data-save-feedback="${log.id}" class="mt-2 text-xs font-medium text-emerald-700 border border-emerald-200 bg-emerald-50 hover:bg-emerald-100 rounded-lg px-3 py-1.5 transition">Save feedback</button>
      </div>
    </div>
  `;
}

function renderSparkline(values, { label = '', unit = '' } = {}) {
  if (values.length < 2) return '';
  const min = Math.min(...values), max = Math.max(...values);
  const range = max - min || 1;
  const w = 320, h = 80, pad = 8;
  const coords = values.map((val, i) => {
    const x = pad + (i / (values.length - 1)) * (w - pad * 2);
    const y = pad + (1 - (val - min) / range) * (h - pad * 2);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  return `
    <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
      <p class="text-xs text-slate-500 mb-2">${escapeHtml(label)} (${min}${unit}–${max}${unit})</p>
      <svg viewBox="0 0 ${w} ${h}" class="w-full h-20" preserveAspectRatio="none">
        <polyline points="${coords}" fill="none" stroke="#10b981" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
      </svg>
    </div>
  `;
}

function renderWeightSparkline(logs) {
  const points = logs.filter(l => l.weight !== null && l.weight !== undefined).slice().reverse();
  return renderSparkline(points.map(p => parseFloat(p.weight)), { label: 'Weight trend', unit: 'kg' });
}

async function handleDuplicatePlan(workouts, targetClientId) {
  if (!targetClientId) { toast('Choose a client to duplicate to first.', 'info'); return; }
  if (!workouts.length) { toast('This client has no workouts to duplicate.', 'info'); return; }
  try {
    const rows = workouts.map(w => ({
      client_id: targetClientId,
      exercise_name: w.exercise_name,
      sets: w.sets,
      target_reps: w.target_reps,
      target_weight: w.target_weight,
      video_url: w.video_url,
      day_label: w.day_label,
      days_of_week: w.days_of_week || [],
      instructions: w.instructions
    }));
    const { error } = await sb.from('workouts').insert(rows);
    if (error) throw error;
    toast(`Plan duplicated — ${rows.length} exercise${rows.length === 1 ? '' : 's'} copied.`, 'success');
  } catch (err) {
    console.error(err);
    toast(err.message || 'Could not duplicate plan.', 'error');
  }
}

function exportClientHistoryCSV(client, logs, setLogs) {
  const rows = [['Type', 'Date', 'Exercise', 'Set #', 'Weight', 'Reps', 'Set type', 'Water (L)', 'Waist (cm)', 'Chest (cm)', 'Hips (cm)', 'Arms (cm)', 'Notes/Feedback']];
  logs.forEach(l => {
    rows.push(['Daily log', toDateStr(new Date(l.logged_at)), '', '', l.weight || '', '', '', l.water_liters || '', l.waist_cm || '', l.chest_cm || '', l.hips_cm || '', l.arms_cm || '', l.pr_notes || l.coach_feedback || '']);
  });
  setLogs.forEach(s => {
    rows.push(['Set log', s.logged_date, s.exercise_name, s.set_number, s.weight || '', s.reps || '', s.set_type, '', '', '', '', '', '']);
  });
  const csv = rows.map(r => r.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${(client.name || client.email).replace(/[^a-z0-9]/gi, '_')}_history.csv`;
  a.click();
  URL.revokeObjectURL(url);
  toast('CSV downloaded.', 'success');
}

async function handleEditClient(e, clientId) {
  e.preventDefault();
  const submitBtn = document.getElementById('edit-client-submit');
  const label = document.getElementById('edit-client-submit-label');
  submitBtn.disabled = true;
  const originalLabel = label.textContent;
  label.innerHTML = `<span class="spinner-light inline-block align-middle"></span>`;

  try {
    const restDays = [...document.querySelectorAll('[data-rest-day]:checked')].map(cb => parseInt(cb.dataset.restDay, 10));
    const tags = document.getElementById('edit-tags').value.split(',').map(t => t.trim()).filter(Boolean);
    const { error } = await sb.from('profiles').update({
      name: document.getElementById('edit-name').value.trim() || null,
      phone: document.getElementById('edit-phone').value.trim() || null,
      fee_paid: document.getElementById('edit-fee-paid').checked,
      rest_days: restDays,
      tags
    }).eq('id', clientId);
    if (error) throw error;
    toast('Client updated.', 'success');
    await renderCoachDashboardStub();
    coachView = 'clientDetail';
    selectedClientId = clientId;
    renderActiveCoachView();
  } catch (err) {
    console.error(err);
    toast(err.message || 'Could not update client.', 'error');
    submitBtn.disabled = false;
    label.textContent = originalLabel;
  }
}

async function handleDeleteClient(clientId) {
  const reassignSelect = document.getElementById('reassign-select');
  const reassignTo = reassignSelect ? reassignSelect.value : '';

  try {
    if (reassignTo) {
      const { error: reErr } = await sb.from('workouts').update({ client_id: reassignTo }).eq('client_id', clientId);
      if (reErr) throw reErr;
    }
    const { error } = await sb.from('profiles').delete().eq('id', clientId);
    if (error) throw error;
    toast('Client removed.', 'success');
    coachView = 'roster';
    selectedClientId = null;
    await renderCoachDashboardStub();
  } catch (err) {
    console.error(err);
    toast(err.message || 'Could not remove client.', 'error');
  }
}

async function handleRemoveWorkout(workoutId, clientId) {
  try {
    const { error } = await sb.from('workouts').delete().eq('id', workoutId);
    if (error) throw error;
    toast('Workout removed.', 'success');
    renderClientDetailSection(clientId);
  } catch (err) {
    console.error(err);
    toast(err.message || 'Could not remove workout.', 'error');
  }
}

async function handleReassignWorkout(workoutId, newClientId, currentClientId) {
  try {
    const { error } = await sb.from('workouts').update({ client_id: newClientId }).eq('id', workoutId);
    if (error) throw error;
    toast('Workout reassigned.', 'success');
    renderClientDetailSection(currentClientId);
  } catch (err) {
    console.error(err);
    toast(err.message || 'Could not reassign workout.', 'error');
  }
}

async function handleSaveFeedback(logId) {
  const textarea = document.getElementById(`feedback-${logId}`);
  try {
    const { error } = await sb.from('progress_logs').update({
      coach_feedback: textarea.value.trim() || null,
      coach_feedback_at: new Date().toISOString()
    }).eq('id', logId);
    if (error) throw error;
    toast('Feedback saved.', 'success');
  } catch (err) {
    console.error(err);
    toast(err.message || 'Could not save feedback.', 'error');
  }
}

function timeAgo(isoString) {
  const diffMs = Date.now() - new Date(isoString).getTime();
  const mins = Math.floor(diffMs / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}h ago`;
  const days = Math.floor(hrs / 24);
  return `${days}d ago`;
}

/* ============================================================
   SMALL HELPERS
============================================================ */
function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
function escapeAttr(str) {
  return escapeHtml(str).replace(/'/g, '&#39;');
}

/* ============================================================
   AUTH STATE LISTENER + BOOT
============================================================ */
sb.auth.onAuthStateChange((event) => {
  if (event === 'SIGNED_OUT') render();
});

render();
